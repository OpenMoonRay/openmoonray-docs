{% if include.images.size > 0 %}
<div class="image-gallery cf">
{%- for img in include.images -%}
  <div>
    <img src="{{site.baseurl}}/{{include.data.image_path}}/{{img.image}}" alt="{{img.text}}">
    {% if img.text %}<p><center>{{img.text}}</center></p>{% endif %}
  </div>
{% endfor %}
</div><br>
{% endif %}
