{% if include.images.size > 0 %}
<div class="gallery-grid">
{%- for img in include.images -%}
  <figure>
    <img src="{{site.baseurl}}/{{include.data.image_path}}/{{img.image}}" alt="{{img.text}}" lightbox>
    {% if img.text %}
      <figcaption>
      {{img.text}}
      </figcaption>
    {% endif %}
  </figure>
{% endfor %}
</div>
{% endif %}
