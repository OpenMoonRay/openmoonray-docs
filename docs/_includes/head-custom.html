<!-- start custom head snippets, customize with your own _includes/head-custom.html file -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;800&display=swap"
  rel="stylesheet"
/>

<script src="{{ 'assets/js/theme-toggle.js' | relative_url }}"></script>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/themes/light.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/themes/dark.css"
/>
<link
  rel="stylesheet"
  type="text/css"
  href="https://cdn.ampproject.org/v0/bento-lightbox-gallery-1.0.css"
/>
<link rel="stylesheet" href="{{ "/assets/styles/common.css?v=" | append:
site.github.build_revision | relative_url }}">

<link
  rel="icon"
  type="image/png"
  href="{{ '/assets/images/favicon.png' | relative_url }}"
/>
<link
  rel="apple-touch-icon"
  href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="512x512"
  href="{{ '/assets/images/android-chrome-512x512.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="{{ '/assets/images/android-chrome-192x192.png' | relative_url }}"
/>

<style>
  body {
    opacity: 0;
  }

  body.ready,
  html:not(.js) body {
    opacity: 1;
  }
</style>

<script type="module">
  await Promise.allSettled([
    customElements.whenDefined('sl-split-panel'),
    customElements.whenDefined('sl-tree'),
    customElements.whenDefined('sl-tree-item'),
    customElements.whenDefined('dark-mode-toggle'),
  ]);

  // Button, card, and rating are registered now! Add
  // the `ready` class so the UI fades in.
  document.body.classList.add('ready');
</script>

<script type="module" src="https://unpkg.com/dark-mode-toggle"></script>
<script type="module" async src="https://cdn.ampproject.org/bento.mjs"></script>
<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/components/split-panel/split-panel.js"
></script>
<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/components/tree/tree.js"
></script>
<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/components/tree-item/tree-item.js"
></script>
<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/components/icon/icon.js"
></script>
<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.87/dist/components/image-comparer/image-comparer.js"
></script>
<script type="module">
  import { registerIconLibrary } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/utilities/icon-library.js';

  registerIconLibrary('material', {
    resolver: (name) => {
      const match = name.match(/^(.*?)(_(round|sharp))?$/);
      return `https://cdn.jsdelivr.net/npm/@material-icons/svg@1.0.5/svg/${
        match[1]
      }/${match[3] || 'outline'}.svg`;
    },
    mutator: (svg) => svg.setAttribute('fill', 'currentColor'),
  });
</script>
<script type="module" src="{{ 'assets/js/common.js' | relative_url }}"></script>

{% if page.maths %}
<!-- Setup MathJax LaTex formatting -->
<script>
  MathJax = {
    tex: {
      inlineMath: [
        ['$', '$'],
        ['\\(', '\\)'],
      ],
    },
  };
</script>

<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
></script>

<script
  type="text/javascript"
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
></script>

{% endif %}
<!-- end custom head snippets -->
