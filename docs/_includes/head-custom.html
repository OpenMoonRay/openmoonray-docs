<script type="module">
  import { registerIconLibrary } from 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.12.0/cdn/utilities/icon-library.js';

  registerIconLibrary('material', {
    resolver: (name) => {
      const match = name.match(/^(.*?)(_(round|sharp))?$/);
      return `https://cdn.jsdelivr.net/npm/@material-icons/svg@1.0.5/svg/${
        match[1]
      }/${match[3] || 'outline'}.svg`;
    },
    mutator: (svg) => svg.setAttribute('fill', 'currentColor'),
  });
</script>
<script type="module" src="{{ 'assets/js/common.js' | relative_url }}"></script>

{% if page.maths %}
<!-- Setup MathJax LaTex formatting -->
<script>
  MathJax = {
    tex: {
      inlineMath: [
        ['$', '$'],
        ['\\(', '\\)'],
      ],
    },
  };
</script>

<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
></script>

<script
  type="text/javascript"
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
></script>

{% endif %}
