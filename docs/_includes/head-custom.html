<!-- start custom head snippets, customize with your own _includes/head-custom.html file -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;800&display=swap"
  rel="stylesheet"
/>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/themes/light.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.0.0-beta.83/dist/themes/dark.css"
/>
<link
  rel="stylesheet"
  type="text/css"
  href="https://cdn.ampproject.org/v0/bento-lightbox-gallery-1.0.css"
/>

<link rel="stylesheet" href="{{ "/assets/styles/common.css?v=" | append:
site.github.build_revision | relative_url }}">

<link
  rel="icon"
  type="image/png"
  href="{{ '/assets/images/favicon.png' | relative_url }}"
/>
<link
  rel="apple-touch-icon"
  href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="512x512"
  href="{{ '/assets/images/android-chrome-512x512.png' | relative_url }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="{{ '/assets/images/android-chrome-192x192.png' | relative_url }}"
/>

<style>
  body {
    opacity: 0;
  }

  body.ready,
  html:not(.js) body {
    opacity: 1;
  }
</style>


{% vite_javascript_tag js/common %}

{% if page.maths %}
<!-- Setup MathJax LaTex formatting -->
<script>
  MathJax = {
    tex: {
      inlineMath: [
        ['$', '$'],
        ['\\(', '\\)'],
      ],
    },
  };
</script>

<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
></script>

<script
  type="text/javascript"
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
></script>

{% endif %}
