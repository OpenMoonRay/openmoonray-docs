{% if include.position %}
<sl-image-comparer position="{{include.position}}">
{% else %}
<sl-image-comparer>
{% endif %}
<sl-icon slot="handle" library="material" name="drag_indicator"></sl-icon>
    <img
      slot="before"
      src="{{include.image_path_before | absolute_url}}"
      alt="{{include.image_alt_before}}"
    />
    <img
      slot="after"
      src="{{include.image_path_after | absolute_url}}"
      alt="include.image_alt_after"
    />
  </sl-image-comparer>
