<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>

    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->

  </head>
  <body>
    <div class="wrapper">
      <header>
        <a href="{{ "/" | absolute_url }}"><img src="{{site.logo | relative_url}}" alt="MoonRay" /></a>

        <!-- <p>{{ site.description | default: site.github.project_tagline }}</p> -->

        <p>Last modified on: {{ page.last-modified-date | date: '%-d %B %Y' }}
        <p><a target="_blank" href="{{ site.github.repository_url }}/blob/main/{{ page.path }}">Edit this page</a>
      </header>
      
      <section>
        
      {{ content }}

      </section>
      <footer>
        <p class="view"><a target="_blank" href="{{ site.github.repository_url }}">View the Project on GitHub <small>{{ site.github.repository_nwo }}</small></a></p>
        <p>Copywrite &copy; 2022 DreamWorks Animation LLC. All Rights Reserved.
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
