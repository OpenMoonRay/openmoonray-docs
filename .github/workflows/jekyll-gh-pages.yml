# Workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure Jekyll deployment URL
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("docs/_config.yml")
          config = path.read_text()
          overrides = {
              "url": os.environ["SITE_ORIGIN"],
              "baseurl": os.environ["SITE_BASE_PATH"],
          }

          for key, value in overrides.items():
              pattern = rf"^{re.escape(key)}[ \t]*:.*$"
              replacement = f"{key}: {json.dumps(value)}"
              if re.search(pattern, config, flags=re.MULTILINE):
                  config = re.sub(
                      pattern, lambda _: replacement, config,
                      flags=re.MULTILINE,
                  )
              else:
                  config = config.rstrip() + "\n" + replacement + "\n"

          path.write_text(config)
          PY
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs/
          destination: docs/_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
