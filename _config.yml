logo: /assets/images/logo.png
description: Documentation
theme: jekyll-theme-minimal
baseurl: /manhattan
url: http://dreamworksanimation.github.io/
collections_dir: docs

collections:
  light-filters:
    permalink: docs/:collection/:name
    output: true
    order:
      -Decay-Light-Filter.md
      -Cookie-Light-Filter.md
